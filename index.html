<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ECEAE3'/%3E%3Crect x='10' y='26' width='44' height='12' rx='6' fill='%23c9c7bf'/%3E%3Crect x='10' y='26' width='30' height='12' rx='6' fill='%231D9E75'/%3E%3Ccircle cx='40' cy='32' r='8' fill='%230F6E56'/%3E%3Cpath d='M36.5 32l2.5 2.5 4.5-5' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f7f6f2; --card:#ffffff; --ink:#1f2421; --muted:#6b6f6a;
    --line:rgba(0,0,0,.10); --accent:#1D9E75; --accent-dark:#0F6E56;
    --accent-soft:#E1F5EE; --blue:#378ADD; --gold:#EF9F27;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:24px 16px 64px}
  .wrap{max-width:860px;margin:0 auto}
  header{text-align:center;margin-bottom:24px}
  header h1{font-size:26px;font-weight:600;margin-bottom:4px}
  header p{color:var(--muted);font-size:14px}

  .progress-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 24px;margin-bottom:18px;position:sticky;top:12px;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .pct-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .pct{font-size:40px;font-weight:700;color:var(--accent-dark);line-height:1}
  .count{color:var(--muted);font-size:14px}
  .bar-track{height:22px;background:#ECEAE3;border-radius:999px;overflow:hidden;position:relative}
  .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#1D9E75,#0F6E56);border-radius:999px;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .motiv{margin-top:14px;background:var(--accent-soft);border:1px solid #9FE1CB;color:var(--accent-dark);border-radius:10px;padding:12px 14px;font-size:15px;min-height:46px;display:flex;align-items:center;gap:10px;transition:opacity .3s}
  .motiv .ico{font-size:20px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .toolbar input[type=text]{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
  .btn{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink);transition:.15s}
  .btn:hover{background:#f0efe9}
  .btn.danger{color:#A32D2D;border-color:#F0995B33}

  .lesson{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:.2s}
  .lesson.done{border-color:#9FE1CB;background:#fbfdfc}
  .lesson.holiday{background:#FAF6EC;border-color:#FAC77555;opacity:.85}
  .ltop{display:flex;align-items:flex-start;gap:12px}
  .check{width:26px;height:26px;border:2px solid #c9c7bf;border-radius:7px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;background:#fff;transition:.15s;margin-top:2px}
  .check.on{background:var(--accent);border-color:var(--accent)}
  .lesson.holiday .check{visibility:hidden}
  .lmeta{flex:1;min-width:0}
  .lnum{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .ltitle{font-size:15px;font-weight:500;margin:2px 0 3px}
  .lsub{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
  .lsub .teacher{color:var(--blue)}
  .holiday-tag{display:inline-block;background:#FAC775;color:#633806;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:4px}

  .cmt-toggle{font-size:12.5px;color:var(--accent-dark);background:none;border:none;cursor:pointer;padding:6px 0 0 38px;font-family:inherit}
  .cmt-toggle:hover{text-decoration:underline}
  .cmt-box{margin:10px 0 2px 38px;display:none}
  .cmt-box.open{display:block}
  .cmt-box textarea{width:100%;min-height:60px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;resize:vertical}
  .cmt-date{font-size:11.5px;color:var(--muted);margin-top:5px}
  .cmt-saved{font-size:11.5px;color:var(--accent-dark);margin-left:8px}
  .cmt-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .cmt-btn{padding:6px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit;color:var(--ink);transition:.15s}
  .cmt-btn:hover{background:#f0efe9}
  .cmt-btn.save{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cmt-btn.save:hover{background:var(--accent-dark)}
  .cmt-btn.del{color:#A32D2D;border-color:#F0995B33}
  .cmt-btn.del:hover{background:#FCEBEB}
  .cmt-saved-view{margin:10px 0 2px 38px;display:none;background:#fbfdfc;border:1px solid #9FE1CB;border-radius:9px;padding:10px 12px}
  .cmt-saved-view.open{display:block}
  .cmt-saved-text{font-size:13.5px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .cmt-saved-meta{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  .confetti{position:fixed;width:10px;height:10px;z-index:999;pointer-events:none;border-radius:2px}
</style>
</head>

const TOTAL = LESSONS.filter(l=>!l.holiday).length;
let state = {};

async function loadState(){
  try{
    const raw = localStorage.getItem('tcqa46_state');
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ state = {}; }
}
async function saveState(){
  try{ localStorage.setItem('tcqa46_state', JSON.stringify(state)); }catch(e){}
}

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML='';
  LESSONS.forEach((l,idx)=>{
    const div = document.createElement('div');
    div.className='lesson'+(l.holiday?' holiday':'');
    div.dataset.holiday = l.holiday?'1':'0';
    div.dataset.search = ((l.topic||'')+' '+(l.teacher||'')).toLowerCase();
    if(l.holiday){
      div.innerHTML = `<div class="ltop"><div class="check"></div><div class="lmeta">
        <div class="ltitle">${l.topic}</div>
        <div class="lsub"><span>📅 ${l.date} · ${l.day}</span></div>
        <span class="holiday-tag">Festivo</span></div></div>`;
      list.appendChild(div);
      return;
    }
    const key='l'+l.n;
    const st = state[key]||{};
    if(st.done) div.classList.add('done');
    div.innerHTML = `<div class="ltop">
        <div class="check ${st.done?'on':''}" data-key="${key}">${st.done?'✓':''}</div>
        <div class="lmeta">
          <div class="lnum">CLASE ${l.n} · 📅 ${l.date} · ${l.day}</div>
          <div class="ltitle">${l.topic}</div>
          <div class="lsub"><span class="teacher">👤 ${l.teacher}</span></div>
        </div>
      </div>
      <button class="cmt-toggle" data-cmt="${key}">💬 ${st.comment?'Ver / editar comentario':'Añadir comentario'}</button>
      <div class="cmt-saved-view ${st.comment?'open':''}" id="view-${key}">
        <div class="cmt-saved-text">${st.comment?escapeHtml(st.comment):''}</div>
        <div class="cmt-saved-meta">
          <span>🗓️ ${st.commentDate?('Guardado: '+st.commentDate):''}</span>
          <button class="cmt-btn" data-edit="${key}">✏️ Editar</button>
          <button class="cmt-btn del" data-del="${key}">🗑️ Eliminar</button>
        </div>
      </div>
      <div class="cmt-box ${st.comment?'':''}" id="box-${key}">
        <textarea placeholder="Escribe aquí tus notas, dudas o lo que aprendiste...">${st.comment?escapeHtml(st.comment):''}</textarea>
        <div class="cmt-actions">
          <button class="cmt-btn save" data-save="${key}">💾 Guardar comentario</button>
          <button class="cmt-btn" data-cancel="${key}">Cancelar</button>
          <span class="cmt-saved" id="saved-${key}"></span>
        </div>
      </div>`;
    list.appendChild(div);
  });
  bindEvents();
  updateBar(false);
}

function bindEvents(){
  document.querySelectorAll('.check[data-key]').forEach(c=>{
    c.onclick=async()=>{
      const k=c.dataset.key;
      state[k]=state[k]||{};
      state[k].done=!state[k].done;
      const wasComplete = countDone();
      c.classList.toggle('on',state[k].done);
      c.textContent=state[k].done?'✓':'';
      c.closest('.lesson').classList.toggle('done',state[k].done);
      await saveState();
      updateBar(state[k].done);
    };
  });
  document.querySelectorAll('.cmt-toggle').forEach(b=>{
    b.onclick=()=>{
      const key=b.dataset.cmt;
      const view=document.getElementById('view-'+key);
      const box=document.getElementById('box-'+key);
      if(view.classList.contains('open')){
        view.classList.toggle('open');
      } else {
        box.classList.toggle('open');
      }
    };
  });
  document.querySelectorAll('.cmt-btn[data-save]').forEach(b=>{
    b.onclick=async()=>{
      const key=b.dataset.save;
      const box=document.getElementById('box-'+key);
      const t=box.querySelector('textarea');
      const val=t.value.trim();
      if(!val){ alert('El comentario está vacío. Escribe algo antes de guardar.'); return; }
      state[key]=state[key]||{};
      state[key].comment=val;
      state[key].commentDate=todayStr();
      await saveState();
      const sv=document.getElementById('saved-'+key);
      if(sv){sv.textContent='✓ guardado';}
      setTimeout(()=>render(),500);
    };
  });
  document.querySelectorAll('.cmt-btn[data-cancel]').forEach(b=>{
    b.onclick=()=>{
      const key=b.dataset.cancel;
      const box=document.getElementById('box-'+key);
      const st=state[key]||{};
      box.querySelector('textarea').value=st.comment||'';
      box.classList.remove('open');
      if(st.comment) document.getElementById('view-'+key).classList.add('open');
    };
  });
  document.querySelectorAll('.cmt-btn[data-edit]').forEach(b=>{
    b.onclick=()=>{
      const key=b.dataset.edit;
      document.getElementById('view-'+key).classList.remove('open');
      document.getElementById('box-'+key).classList.add('open');
    };
  });
  document.querySelectorAll('.cmt-btn[data-del]').forEach(b=>{
    b.onclick=async()=>{
      const key=b.dataset.del;
      if(!confirm('¿Eliminar este comentario? No se puede deshacer.')) return;
      if(state[key]){ delete state[key].comment; delete state[key].commentDate; }
      await saveState();
      render();
    };
  });
}

function countDone(){
  return LESSONS.filter(l=>!l.holiday && state['l'+l.n] && state['l'+l.n].done).length;
}

function updateBar(justChecked){
  const done=countDone();
  const pct=Math.round(done/TOTAL*100);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('count').textContent=`${done} de ${TOTAL} clases completadas`;
  if(justChecked && done>0){
    const msg=document.getElementById('motivText');
    const box=document.getElementById('motiv');
    box.style.opacity=0;
    setTimeout(()=>{
      msg.textContent=MOTIV[Math.min(done-1,MOTIV.length-1)];
      box.querySelector('.ico').textContent = done===TOTAL?'🎓':'🌟';
      box.style.opacity=1;
    },200);
    if(done===TOTAL) confetti();
  }
}

function confetti(){
  const colors=['#1D9E75','#EF9F27','#378ADD','#D4537E','#7F77DD'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.top='-20px';
    c.style.background=colors[i%colors.length];
    document.body.appendChild(c);
    const dur=2000+Math.random()*1500;
    c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${window.innerHeight+40}px) rotate(${720*Math.random()}deg)`,opacity:.4}],{duration:dur,easing:'ease-in'});
    setTimeout(()=>c.remove(),dur);
  }
}

document.getElementById('search').oninput=function(){
  const q=this.value.toLowerCase().trim();
  document.querySelectorAll('.lesson').forEach(l=>{
    l.style.display = (!q || l.dataset.search.includes(q))?'':'none';
  });
};
let holidayHidden=false;
document.getElementById('hideHoliday').onclick=function(){
  holidayHidden=!holidayHidden;
  this.textContent=holidayHidden?'Mostrar festivos':'Ocultar festivos';
  document.querySelectorAll('.lesson[data-holiday="1"]').forEach(l=>{l.style.display=holidayHidden?'none':'';});
};
document.getElementById('reset').onclick=async function(){
  if(confirm('¿Seguro que quieres reiniciar todo tu progreso y comentarios?')){
    state={};
    await saveState();
    render();
    document.getElementById('motivText').textContent='¡Empieza tu camino! Marca tu primera clase cuando estés listo.';
    document.getElementById('motiv').querySelector('.ico').textContent='🌱';
  }
};

(async function(){ await loadState(); render(); })();
</script>
